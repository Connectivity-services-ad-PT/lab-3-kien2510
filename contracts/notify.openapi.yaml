openapi: 3.1.0

info:
  title: A7 - Notification Service (Product A)
  version: 1.0.0
  description: Dịch vụ gửi thông báo và cảnh báo đa kênh cho Smart Campus Ecosystem
  contact:
    name: Nguyễn Trung Kiên
    email: kien.nt.7a@example.edu.vn

servers:
  - url: http://localhost:8007

tags:
  - name: health
  - name: notifications

paths:
  /health:
    get:
      operationId: getHealth
      tags: [health]
      summary: Kiểm tra sức khỏe service
      description: Trả về trạng thái hoạt động của Notification Service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  service: { type: string }
                  version: { type: string }

  /api/notifications:
    post:
      operationId: sendNotification
      tags: [notifications]
      summary: Gửi thông báo mới
      description: Tạo và gửi thông báo đến người dùng qua nhiều kênh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, title, message]
              properties:
                user_id: { type: string }
                title: { type: string }
                message: { type: string }
                channel: 
                  type: string
                  enum: [inapp, push, email, sms]
                  default: inapp
                priority:
                  type: string
                  enum: [low, normal, high]
                  default: normal
      responses:
        '201':
          description: Thông báo đã được gửi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification_id: { type: string }
                  status: { type: string }
                  sent_at: { type: string, format: date-time }