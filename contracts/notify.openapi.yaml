openapi: 3.1.0

info:
  title: A7 - Notification Service
  version: 1.0.0
  description: Notification Service for Smart Campus
  contact:
    name: A7 Team
    email: a7@example.com

servers:
  - url: http://localhost:8007

paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      tags:
        - health
      description: Returns the health status of the Notification Service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /api/notifications:
    post:
      operationId: sendNotification
      summary: Send a notification
      tags:
        - notifications
      description: Sends a notification to a user via the specified channel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, title, message]
              properties:
                user_id: { type: string }
                title: { type: string }
                message: { type: string }
                channel:
                  type: string
                  enum: [inapp, push, email, sms]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  notification_id: { type: string }
                  status: { type: string }